[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 180
preDeployCommand = "sh -c 'NODE_ENV=production npx medusa db:migrate'"
startCommand = "sh -c 'NODE_ENV=production exec npx medusa start --port ${PORT:-9000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
